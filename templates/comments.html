<!DOCTYPE html>
<html>
<head><title>Stored XSS Demo</title></head>
<body>
  <h2>Comments</h2>
  <form method="POST">
    <input type="text" name="comment" required>
    <button type="submit">Post</button>
  </form>
  <h3>Unsafe (| safe):</h3>
  <ul>{% for c in comments %}<li>{{ c | safe }}</li>{% endfor %}</ul>
  <h3>Fixed (Jinja2 Auto-Escaping):</h3>
  <ul>{% for c in comments %}<li>{{ c }}</li>{% endfor %}</ul>
</body>
</html>
